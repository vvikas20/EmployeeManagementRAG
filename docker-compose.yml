services:
  # 1. Ollama Runtime Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  # 2. Automated Model Puller (Runs once on startup, then stops)
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama_model_puller
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        echo "Waiting for Ollama service to start..."
        until ollama list > /dev/null 2>&1; do sleep 2; done
        echo "Pulling embedding model (mxbai-embed-large)..."
        ollama pull mxbai-embed-large
        echo "Embedding model ready!"
    restart: "no"

  # 3. Enterprise Employee RAG Application
  employee-rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    # To run directly from Docker Hub, replace the 'build' section with:
    # image: <your-dockerhub-username>/employee-rag-system:latest
    container_name: employee_rag_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/employee_management.db
      - LLM_PROFILE=groq
      - OLLAMA_BASE_URL=http://ollama:11434
      # Optional: Cloud API keys if switching LLM profiles
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Persist SQLite database file on host
      - ./data:/app/data
      # Persist ChromaDB vector store embeddings on host
      - ./vector_store:/app/vector_store
      # Mount config.local.yaml for local development API keys (Groq/Gemini)
      - ./config.local.yaml:/app/config.local.yaml:ro
    depends_on:
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama_models:

